<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>싱클 Syncle 발표</title>
<style>
  /* 슬라이드는 그림이라 글꼴이 없어도 똑같이 보여요. 아래 글꼴은 안내 문구에만 써요. */
  :root { --bg: #0b0e1f; --ink: #ffffff; --muted: #aab0d0; --accent: #3346d3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; }
  #stage img.slide { position: absolute; inset: 0; width: 100%; height: 100%; display: none; user-select: none; -webkit-user-drag: none; }
  #stage img.slide.on { display: block; }
  /* 12장 영상 자리 (PPT의 휴대폰 화면 자리와 같은 위치 · 크기: x 1.35 · y 1.85 · 2.693 × 5.15 인치) */
  #video { position: absolute; left: 10.125%; top: 24.667%; width: 20.197%; height: 68.667%;
    background: #000; object-fit: contain; display: none; border-radius: calc(var(--u) * 0.16); }
  #video.on { display: block; }
  #notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; overflow: auto; display: none;
    background: rgba(11, 14, 31, 0.94); color: var(--ink); padding: 18px 28px 22px; font-size: 20px; line-height: 1.6;
    white-space: pre-wrap; border-top: 1px solid #2a2f52; }
  #notes.on { display: block; }
  #notes b { color: var(--muted); font-weight: 600; font-size: 15px; display: block; margin-bottom: 6px; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(0,0,0,0.72); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: opacity 0.6s; pointer-events: none; white-space: nowrap; }
  #count { position: fixed; right: 14px; top: 10px; font-size: 13px; color: var(--muted); opacity: 0; transition: opacity 0.3s; }
  body.moving #count { opacity: 1; }
  body.moving { cursor: default; }
  body:not(.moving) { cursor: none; }
  /* 발표자 창 */
  body.presenter { overflow: auto; cursor: default; }
  .pv { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; padding: 18px; height: 100vh; }
  .pv .now, .pv .next { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fff; border-radius: 6px; }
  .pv .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .pv .meta { display: flex; justify-content: space-between; font-size: 22px; font-weight: 600; }
  .pv .notes { font-size: 22px; line-height: 1.65; white-space: pre-wrap; overflow: auto; padding-top: 12px; border-top: 1px solid #2a2f52; }
  .pv .label { color: var(--muted); font-size: 14px; }
  .pv .keys { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <!--SLIDES-->
  <video id="video" src="media/demo.mp4" poster="media/poster.png" controls playsinline preload="metadata"></video>
</div>
<div id="notes"></div>
<div id="hint">→ · 스페이스 · 클릭: 다음 &nbsp;|&nbsp; ←: 이전 &nbsp;|&nbsp; F: 전체 화면 &nbsp;|&nbsp; N: 대본 &nbsp;|&nbsp; P: 발표자 창</div>
<div id="count"></div>
<script>
const NOTES = /*NOTES*/[];
const TOTAL = NOTES.length;
const VIDEO_SLIDE = 12;
const presenter = new URLSearchParams(location.search).get("presenter") === "1";
let cur = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), TOTAL);
let peer = null; // 발표 창 ↔ 발표자 창
const pad = (n) => String(n).padStart(2, "0");

/* ── 영상: media/demo.mp4가 있으면 12장 영상 자리에 보여요. 없으면 PPT의 빈 자리 그림 그대로 ── */
const video = document.getElementById("video");
let hasVideo = false;
video.addEventListener("loadedmetadata", () => { hasVideo = true; show(cur, false); });
video.addEventListener("error", () => { hasVideo = false; video.classList.remove("on"); });

function fit() {
  const st = document.getElementById("stage");
  if (!st) return;
  const w = Math.min(window.innerWidth, window.innerHeight * 16 / 9);
  st.style.width = w + "px";
  st.style.height = (w * 9 / 16) + "px";
  st.style.setProperty("--u", (w / 13.333) + "px");
}

function show(n, tell = true) {
  cur = Math.min(Math.max(n, 1), TOTAL);
  history.replaceState(null, "", (presenter ? "?presenter=1" : "") + "#" + cur);
  if (presenter) return renderPresenter(tell);
  document.querySelectorAll("img.slide").forEach((img, i) => img.classList.toggle("on", i + 1 === cur));
  const onVideo = cur === VIDEO_SLIDE && hasVideo;
  video.classList.toggle("on", onVideo);
  if (!onVideo && !video.paused) video.pause();
  document.getElementById("count").textContent = cur + " / " + TOTAL;
  const nt = document.getElementById("notes");
  nt.innerHTML = "<b>" + cur + "장 대본</b>" + escapeHtml(NOTES[cur - 1] || "");
  if (tell && peer && !peer.closed) peer.postMessage({ slide: cur }, "*");
}

function escapeHtml(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

/* ── 발표자 창: 지금 장 · 다음 장 · 대본 · 시계 ── */
let started = Date.now();
function renderPresenter(tell) {
  document.getElementById("now").src = "slides/" + pad(cur) + ".png";
  const nx = document.getElementById("next");
  nx.style.visibility = cur < TOTAL ? "visible" : "hidden";
  if (cur < TOTAL) nx.src = "slides/" + pad(cur + 1) + ".png";
  document.getElementById("pnum").textContent = cur + " / " + TOTAL;
  document.getElementById("pnotes").textContent = NOTES[cur - 1] || "";
  if (tell && window.opener && !window.opener.closed) window.opener.postMessage({ slide: cur }, "*");
}
function tick() {
  const s = Math.floor((Date.now() - started) / 1000);
  const el = document.getElementById("clock");
  if (el) el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

window.addEventListener("message", (e) => { if (e.data && e.data.slide) show(e.data.slide, false); });

function key(e) {
  if (e.target === video && [" ", "Enter"].includes(e.key)) return; // 영상 재생 버튼 조작은 그대로
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); show(cur - 1); }
  else if (k === "Home") show(1);
  else if (k === "End") show(TOTAL);
  else if (k === "f" || k === "F") { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if ((k === "n" || k === "N") && !presenter) document.getElementById("notes").classList.toggle("on");
  else if ((k === "p" || k === "P") && !presenter) {
    peer = window.open(location.pathname + "?presenter=1#" + cur, "syncle-presenter", "width=1200,height=760");
  }
  else if ((k === "v" || k === "V") && cur === VIDEO_SLIDE && hasVideo && !presenter) { video.paused ? video.play() : video.pause(); }
}

if (presenter) {
  document.body.className = "presenter";
  document.body.innerHTML = `
    <div class="pv">
      <div style="display:flex;flex-direction:column;gap:10px;min-height:0">
        <div class="label">지금 장</div><img class="now" id="now" alt="">
        <div class="keys">→ · 스페이스: 다음 · ←: 이전 · 이 창에서 넘겨도 발표 화면이 같이 넘어가요</div>
      </div>
      <div class="side">
        <div class="meta"><span id="pnum"></span><span id="clock">0:00</span></div>
        <div class="label">다음 장</div><img class="next" id="next" alt="">
        <div class="notes" id="pnotes"></div>
      </div>
    </div>`;
  setInterval(tick, 1000);
  document.addEventListener("click", (e) => { if (e.target.id === "clock") started = Date.now(); });
} else {
  fit();
  window.addEventListener("resize", fit);
  document.getElementById("stage").addEventListener("click", (e) => {
    if (e.target === video) return;
    const r = e.currentTarget.getBoundingClientRect();
    show(e.clientX - r.left < r.width * 0.3 ? cur - 1 : cur + 1);
  });
  let idle;
  document.addEventListener("mousemove", () => {
    document.body.classList.add("moving");
    clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.remove("moving"), 1500);
  });
  setTimeout(() => (document.getElementById("hint").style.opacity = "0"), 4500);
  // 그림 미리 불러오기 (넘길 때 깜빡이지 않게)
  document.querySelectorAll("img.slide").forEach((img) => { const i = new Image(); i.src = img.src; });
}
document.addEventListener("keydown", key);
show(cur, false);
</script>
</body>
</html>
